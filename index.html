<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
</head>
<body>

    <h1>Job Application Form</h1>
    <p>Please fill in all the required information.</p>

    <form action="#" method="post" enctype="multipart/form-data">

        <!-- 1. Personal Information -->
        <fieldset>
            <legend>Personal Information</legend>

            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname"
                   placeholder="Enter your full name" required>
            <br><br>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email"
                   placeholder="example@gmail.com" required>
            <br><br>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone"
                   placeholder="Enter your phone number" required>
            <br><br>

            <label for="website">Website or Portfolio:</label>
            <input type="url" id="website" name="website"
                   placeholder="https://example.com">
            <br><br>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required>
            <br><br>
        </fieldset>

        <br>

        <!-- 2. Job Details -->
        <fieldset>
            <legend>Job Details</legend>

            <label for="position">Job Position:</label>
            <select id="position" name="position" required>
                <option value="">Select a position</option>
                <option value="frontend">Frontend Developer</option>
                <option value="backend">Backend Developer</option>
                <option value="uiux">UI/UX Designer</option>
                <option value="qa">QA Engineer</option>
            </select>

            <br><br>

            Preferred Work Location:
            <br>

            <input type="radio" id="onsite" name="location"
                   value="onsite" required>
            <label for="onsite">On-site</label>
            <br>

            <input type="radio" id="remote" name="location"
                   value="remote">
            <label for="remote">Remote</label>
            <br>

            <input type="radio" id="hybrid" name="location"
                   value="hybrid">
            <label for="hybrid">Hybrid</label>

            <br><br>

            Skills:
            <br>

            <input type="checkbox" id="html" name="skills[]"
                   value="HTML">
            <label for="html">HTML</label>
            <br>

            <input type="checkbox" id="css" name="skills[]"
                   value="CSS">
            <label for="css">CSS</label>
            <br>

            <input type="checkbox" id="javascript" name="skills[]"
                   value="JavaScript">
            <label for="javascript">JavaScript</label>
            <br>

            <input type="checkbox" id="react" name="skills[]"
                   value="React">
            <label for="react">React</label>
            <br>

            <input type="checkbox" id="nodejs" name="skills[]"
                   value="Node.js">
            <label for="nodejs">Node.js</label>

            <br><br>

            <label for="resume">Resume Upload:</label>
            <input type="file" id="resume" name="resume"
                   accept=".pdf,.doc,.docx" required>
            <br><br>

            <label for="about">Write About Yourself:</label>
            <br>
            <textarea id="about" name="about" rows="5" cols="40"
                      placeholder="Tell us about yourself..."
                      required></textarea>
            <br><br>
        </fieldset>

        <br>

        <!-- 3. Extra Section -->
        <fieldset>
            <legend>Extra Section</legend>

            <label for="tech">Search Your Favorite Tech Stack:</label>
            <input type="search" id="tech" name="tech"
                   placeholder="Search technology">
            <br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password"
                   placeholder="Create a password" required>
            <br><br>

            <label for="confirm">Confirm Password:</label>
            <input type="password" id="confirm" name="confirm"
                   placeholder="Confirm your password" required>
            <br><br>
        </fieldset>

        <br>

        <!-- Submit Button -->
        <input type="submit" value="Submit Application">
        <input type="reset" value="Reset Form">

    </form>

</body>
</html>
